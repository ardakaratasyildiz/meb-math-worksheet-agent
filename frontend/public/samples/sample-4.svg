<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 297" width="210" height="297">
  <rect width="210" height="297" fill="#FFFFFF"/>
  <text x="105" y="32" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">4. Sınıf · Çıkarma</text>
  <text x="105" y="48" font-family="Inter, sans-serif" font-size="9" fill="#64748B" text-anchor="middle">Kazanım: M.4.1.2.4 · Kolay zorluk</text>
  <line x1="20" y1="60" x2="190" y2="60" stroke="#E2E8F0" stroke-width="0.5"/>
  <g font-family="Inter, sans-serif" font-size="8" fill="#0F172A">
    <text x="20" y="80">Soru 1</text>
    <text x="20" y="92" fill="#475569">Bir kütüphanede 245 kitap vardı.</text>
    <text x="20" y="103" fill="#475569">87 kitap ödünç verildiğine göre,</text>
    <text x="20" y="114" fill="#475569">kütüphanede kaç kitap kalmıştır?</text>
    <line x1="20" y1="125" x2="190" y2="125" stroke="#94A3B8" stroke-width="0.3" stroke-dasharray="2,2"/>
    <text x="20" y="145">Soru 2</text>
    <text x="20" y="157" fill="#475569">Aşağıdaki çıkarma işlemini yapınız:</text>
    <text x="65" y="172" font-size="11" font-family="monospace">  632</text>
    <text x="65" y="184" font-size="11" font-family="monospace">- 158</text>
    <line x1="65" y1="187" x2="105" y2="187" stroke="#0F172A" stroke-width="0.5"/>
    <line x1="20" y1="200" x2="190" y2="200" stroke="#94A3B8" stroke-width="0.3" stroke-dasharray="2,2"/>
    <text x="20" y="220">Soru 3</text>
    <text x="20" y="232" fill="#475569">Ahmet 1500 TL'lik telefon almak istiyor.</text>
    <text x="20" y="243" fill="#475569">925 TL biriktirdi. Geriye kaç TL kaldı?</text>
    <line x1="20" y1="255" x2="190" y2="255" stroke="#94A3B8" stroke-width="0.3" stroke-dasharray="2,2"/>
    <text x="20" y="270">Soru 4</text>
    <text x="20" y="282" fill="#475569">9000 — 4500 işleminin sonucu...</text>
  </g>
  <rect x="20" y="287" width="170" height="8" fill="#EEF2FF" rx="2"/>
  <text x="105" y="293" font-family="Inter, sans-serif" font-size="5" fill="#4F46E5" text-anchor="middle" font-weight="600">Quiz Marketi · MEB müfredatına uyumlu</text>
</svg>
