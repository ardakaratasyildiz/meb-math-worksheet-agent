<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 297" width="210" height="297">
  <rect width="210" height="297" fill="#FFFFFF"/>
  <text x="105" y="32" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">5. Sınıf · Cebir</text>
  <text x="105" y="48" font-family="Inter, sans-serif" font-size="9" fill="#64748B" text-anchor="middle">Kazanım: M.5.2.1.1 · Orta zorluk</text>
  <line x1="20" y1="60" x2="190" y2="60" stroke="#E2E8F0" stroke-width="0.5"/>
  <g font-family="Inter, sans-serif" font-size="8" fill="#0F172A">
    <text x="20" y="80">Soru 1</text>
    <text x="20" y="92" fill="#475569">Bir markette 3x + 5 = 20 denkleminin</text>
    <text x="20" y="103" fill="#475569">çözümü olan x değeri kaçtır?</text>
    <line x1="20" y1="115" x2="190" y2="115" stroke="#94A3B8" stroke-width="0.3" stroke-dasharray="2,2"/>
    <text x="20" y="135">Soru 2</text>
    <text x="20" y="147" fill="#475569">Aşağıdaki ifadelerden hangisi</text>
    <text x="20" y="158" fill="#475569">2x + 3 = x + 8 ile aynıdır?</text>
    <text x="28" y="170" fill="#475569">A) x = 5     B) x = 4</text>
    <text x="28" y="180" fill="#475569">C) x = 11    D) x = 3</text>
    <line x1="20" y1="190" x2="190" y2="190" stroke="#94A3B8" stroke-width="0.3" stroke-dasharray="2,2"/>
    <text x="20" y="210">Soru 3</text>
    <text x="20" y="222" fill="#475569">Cengiz, kaleminin sayısının 3 katından</text>
    <text x="20" y="233" fill="#475569">2 fazlasını alıp toplam 14 oldu...</text>
  </g>
  <rect x="20" y="270" width="170" height="20" fill="#EEF2FF" rx="3"/>
  <text x="105" y="283" font-family="Inter, sans-serif" font-size="7" fill="#4F46E5" text-anchor="middle" font-weight="600">Quiz Marketi · MEB müfredatına uyumlu</text>
</svg>
