<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 297" width="210" height="297">
  <rect width="210" height="297" fill="#FFFFFF"/>
  <text x="105" y="32" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">6. Sınıf · Kesirler</text>
  <text x="105" y="48" font-family="Inter, sans-serif" font-size="9" fill="#64748B" text-anchor="middle">Kazanım: M.6.1.4.2 · Kolay zorluk</text>
  <line x1="20" y1="60" x2="190" y2="60" stroke="#E2E8F0" stroke-width="0.5"/>
  <g font-family="Inter, sans-serif" font-size="8" fill="#0F172A">
    <text x="20" y="80">Soru 1</text>
    <text x="20" y="92" fill="#475569">2/5 + 1/5 işleminin sonucu kaçtır?</text>
    <line x1="20" y1="105" x2="190" y2="105" stroke="#94A3B8" stroke-width="0.3" stroke-dasharray="2,2"/>
    <text x="20" y="125">Soru 2</text>
    <text x="20" y="137" fill="#475569">3/4 kesrinin pay ve paydası</text>
    <text x="20" y="148" fill="#475569">2 ile çarpılırsa elde edilen kesir kaç?</text>
    <line x1="20" y1="160" x2="190" y2="160" stroke="#94A3B8" stroke-width="0.3" stroke-dasharray="2,2"/>
    <text x="20" y="180">Soru 3</text>
    <text x="20" y="192" fill="#475569">Aşağıdaki kesirlerden hangisi</text>
    <text x="20" y="203" fill="#475569">en büyüktür?</text>
    <text x="28" y="215" fill="#475569">A) 1/2     B) 2/3</text>
    <text x="28" y="225" fill="#475569">C) 3/4     D) 4/5</text>
    <line x1="20" y1="235" x2="190" y2="235" stroke="#94A3B8" stroke-width="0.3" stroke-dasharray="2,2"/>
    <text x="20" y="255">Soru 4</text>
    <text x="20" y="267" fill="#475569">Bir pizzanın 3/8'i yenmiş ise...</text>
  </g>
  <rect x="20" y="280" width="170" height="14" fill="#EEF2FF" rx="3"/>
  <text x="105" y="290" font-family="Inter, sans-serif" font-size="6" fill="#4F46E5" text-anchor="middle" font-weight="600">Quiz Marketi · MEB müfredatına uyumlu</text>
</svg>
