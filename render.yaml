# Render Blueprint — bir tıkla backend deploy.
# Kullanım: Render → New → Blueprint → repo'yu seç → Deploy.
# Free tier: 750 saat/ay. TURSO_DATABASE_URL set edilirse kalıcı (libSQL),
# değilse lokal SQLite restart'ta sıfırlanır. Müfredat (knowledge_base/) image'da kalıcı.
#
# UptimeRobot pinger /healthz'a 14 dk'da bir vurarak cold start'ı önler.

services:
  - type: web
    name: sheetgen-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt # Avrupa, Türkiye'ye en yakın
    branch: main
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      # LLM
      - key: GEMINI_API_KEY
        sync: false # Render dashboard'dan elle gir (sırrı)
      # Gemini'yi temiz-IP'li proxy (Cloudflare Worker) üzerinden geçir — Render
      # free-tier paylaşımlı IP'si Google'ca bloklanınca (403 "from this server").
      # BOŞ → doğrudan Google. Örn: https://gemini-proxy.<hesap>.workers.dev
      - key: GEMINI_BASE_URL
        sync: false
      # Render uygulamaya kendi ic aginin IP'siyle (10.x) baglanir; uvicorn
      # varsayilan olarak yalniz 127.0.0.1'e guvendigi icin X-Forwarded-For HIC
      # okunmuyordu -> anonim ziyaretcilerin TAMAMI tek rate-limit kovasini
      # paylasiyordu (5/dk, 30/saat). CIDR verildiginde uvicorn XFF'i SAGDAN
      # tarar (spoof'a kapali); "*" verilseydi EN SOLDAKI (istemcinin yazdigi)
      # girdi alinir ve sinir bypass edilebilirdi. bkz. start.sh
      - key: FORWARDED_ALLOW_IPS
        value: 10.0.0.0/8
      - key: GEMINI_PROXY_SECRET
        sync: false # worker'daki PROXY_SECRET ile AYNI olmalı
      - key: ENABLE_ANTHROPIC_FALLBACK
        value: "false"
      - key: ANTHROPIC_API_KEY
        sync: false

      # API auth — frontend NEXT_PUBLIC_API_KEY ile aynı olmalı
      - key: API_KEYS
        sync: false

      # /admin/* endpoint'leri için ayrı key (X-Admin-Key header)
      - key: ADMIN_API_KEY
        sync: false

      # Turso (libSQL) — kalıcı SQLite, free tier 9GB. Boş bırakırsan
      # lokal sqlite (her restart'ta cache+history sıfırlanır).
      - key: TURSO_DATABASE_URL
        sync: false  # ör. libsql://<your-db>.turso.io
      - key: TURSO_AUTH_TOKEN
        sync: false

      # Clerk oturum JWT doğrulama (P0 — billing ön koşulu). BOŞ bırakılırsa
      # doğrulama DEVRE DIŞI (bugünkü davranış; hiçbir şey kırılmaz). Frontend
      # Bearer token göndermeye başladığında issuer'ı gir → doğrulama devreye girer.
      # CLERK_ISSUER token'daki `iss` ile birebir eşleşmeli (ör.
      # https://clerk.soruatolyesi.com veya https://<slug>.clerk.accounts.dev).
      - key: CLERK_ISSUER
        sync: false
      # Clerk Backend API sırrı — sunucu-tarafı ROL kontrolü (publicMetadata.role çekimi;
      # app/services/clerk_roles.py). BOŞ → rol enforcement kapalı (fail-open). Frontend
      # (Vercel) CLERK_SECRET_KEY ile aynı değer girilebilir.
      - key: CLERK_SECRET_KEY
        sync: false

      # RevenueCat webhook (mobil IAP → abonelik senkronu). RevenueCat panosundaki
      # webhook Authorization header değeriyle BİREBİR aynı olmalı (paylaşımlı sır).
      # BOŞ → doğrulama atlanır (yalnız sandbox); prod'da MUTLAKA set et.
      # REVENUECAT_PRODUCT_MAP opsiyonel: "product_id:plan_code" çiftleri (virgülle).
      - key: REVENUECAT_WEBHOOK_AUTH
        sync: false
      - key: REVENUECAT_PRODUCT_MAP
        sync: false

      # Rate limit — production
      - key: RATE_LIMIT_PER_HOUR
        value: "60"
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"

      # Cache
      - key: ENABLE_GENERATION_CACHE
        value: "true"
      - key: GENERATION_CACHE_MAX_PER_KEY
        value: "10"

      # Critic & verifier
      - key: ENABLE_CRITIC
        value: "true"
      - key: ENABLE_MATH_VERIFIER
        value: "true"

      # Çok-ders kalite kapıları — 2026-07-10 go-live: hepsi açık. Kapatmak için
      # ilgili değeri "false" yap (frontend NEXT_PUBLIC_ENABLED_SUBJECTS ile eşle).
      - key: FEN_ENABLED
        value: "true"
      - key: TURKCE_ENABLED
        value: "true"
      - key: SOSYAL_ENABLED
        value: "true"
      - key: INGILIZCE_ENABLED
        value: "true"

      # Sentry
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.1"

      # CORS — Vercel deploy URL'i ile değiştir
      - key: CORS_ORIGINS
        sync: false # ör. "https://sheetgen.vercel.app,https://your-domain.com"

      # Python runtime
      - key: PYTHONIOENCODING
        value: utf-8
